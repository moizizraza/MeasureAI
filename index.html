<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MeasureAI — Real-Time Object Measurement</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />

  <script src="https://unpkg.com/@tensorflow/tfjs@3.21.0/dist/tf.min.js"></script>
  <script src="https://unpkg.com/@tensorflow-models/coco-ssd@2.2.2/dist/coco-ssd.min.js"></script>

  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<!-- ═══ LOADING ═══ -->
<div id="loading-screen">
  <div class="loader-orb">
    <div class="orb-ring r1"></div>
    <div class="orb-ring r2"></div>
    <div class="orb-ring r3"></div>
    <div class="orb-core">
      <svg viewBox="0 0 40 40" fill="none"><path d="M7 14L20 7L33 14V26L20 33L7 26V14Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><circle cx="20" cy="20" r="3.5" fill="currentColor"/></svg>
    </div>
  </div>
  <h1 class="loader-brand">MeasureAI</h1>
  <p class="loader-tagline">AI-Powered · No API Key · 100% Offline</p>
  <div class="loader-progress">
    <div class="loader-track"><div class="loader-fill" id="loader-fill"></div></div>
    <p class="loader-msg" id="loader-msg">Starting…</p>
  </div>
</div>

<!-- ═══ APP ═══ -->
<div id="app" class="hidden">

  <!-- Header -->
  <header class="header">
    <div class="hdr-left">
      <div class="brand">
        <svg class="brand-ico" viewBox="0 0 28 28" fill="none"><path d="M4 10L14 5L24 10V18L14 23L4 18V10Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><circle cx="14" cy="14" r="3" fill="currentColor"/></svg>
        <span class="brand-name">MeasureAI</span>
      </div>
      <div class="offline-badge"><span class="offline-dot"></span><span>Offline AI</span></div>
    </div>
    <div class="hdr-right">
      <button class="icon-btn" id="btn-unit" title="Change unit"><span id="unit-label">cm</span></button>
      <button class="icon-btn" id="btn-flip" title="Flip camera">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 4v6h6M23 20v-6h-6"/><path d="M20.49 9A9 9 0 005.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 013.51 15"/></svg>
      </button>
      <button class="icon-btn" id="btn-history" title="History">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
      </button>
    </div>
  </header>

  <!-- Viewport -->
  <div class="viewport" id="viewport">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
    <div class="scan-overlay"><div class="corner-tl"></div><div class="corner-tr"></div><div class="corner-bl"></div><div class="corner-br"></div></div>
    <div class="scan-beam"></div>

    <div class="vp-status">
      <div class="status-pill"><span class="status-led" id="status-led"></span><span id="status-txt">Initializing…</span></div>
      <div class="fps-chip" id="fps-chip">0 fps</div>
    </div>

    <div class="calib-badge" id="calib-badge">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 1l2 5h5l-4 3 1.5 5L8 11l-4.5 3L5 9 1 6h5z"/></svg>
      <span id="calib-txt">Calibrating…</span>
    </div>

    <div class="freeze-overlay hidden" id="freeze-overlay">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polygon points="5 3 19 12 5 21 5 3"/></svg>
      <span>Tap to resume</span>
    </div>
  </div>

  <!-- Measurement Strip -->
  <div class="results-strip">
    <div class="results-scroll" id="results-scroll">
      <div class="result-placeholder" id="result-placeholder">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/></svg>
        <span>Point camera at objects — AI measures automatically</span>
      </div>
    </div>
  </div>

  <!-- Bottom Bar -->
  <div class="bottom-bar">
    <button class="ctrl-btn" id="btn-freeze">
      <svg id="freeze-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
      <span>Pause</span>
    </button>
    <button class="capture-btn" id="btn-capture"><div class="capture-ring"></div><div class="capture-core"></div></button>
    <button class="ctrl-btn" id="btn-reset">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 109-9M3 3v6h6"/></svg>
      <span>Reset</span>
    </button>
  </div>

  <!-- History Drawer -->
  <div class="drawer hidden" id="history-drawer">
    <div class="drawer-bar"></div>
    <div class="drawer-hdr"><h3>Measurement History</h3><button class="icon-btn" id="btn-clear">Clear</button></div>
    <ul id="history-list" class="history-list"><li class="hist-empty">No measurements yet</li></ul>
  </div>
  <div class="backdrop hidden" id="backdrop"></div>

  <div id="toasts"></div>
</div>

<script src="js/camera.js"></script>
<script src="js/dimensions.js"></script>
<script src="js/detector.js"></script>
<script src="js/renderer.js"></script>
<script src="js/app.js"></script>
</body>
</html>
